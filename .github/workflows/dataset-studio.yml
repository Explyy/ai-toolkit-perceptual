name: Dataset Studio release
on:
  push:
    branches: [codex/dataset-studio-cloud-live]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the reviewed immutable Studio image
        type: boolean
        default: false
permissions:
  contents: read
  packages: write
concurrency:
  group: dataset-studio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source checks
        working-directory: ui
        run: |
          npm ci
          npx prisma generate
          npm run test:studio
          npm run build
          npx tsc --noEmit --incremental false
      - name: Source manifest
        run: python3 scripts/dataset_studio_cloud.py manifest --toolkit "$GITHUB_WORKSPACE" > "$RUNNER_TEMP/studio-source.json"
      - uses: actions/upload-artifact@v4
        with:
          name: dataset-studio-source-${{ github.sha }}
          path: ${{ runner.temp }}/studio-source.json
      - name: Space for CUDA runtime
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          docker system prune --all --force
          df -h /
      - id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: echo "tag=ghcr.io/${OWNER,,}/ai-toolkit-perceptual:dataset-studio-${SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/codex/dataset-studio-cloud-live' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/dataset-studio/Dockerfile
          platforms: linux/amd64
          build-args: STUDIO_RELEASE=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/codex/dataset-studio-cloud-live' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)) }}
          tags: ${{ steps.image.outputs.tag }}
      - name: Immutable deployment reference
        env:
          TAG: ${{ steps.image.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "Studio image $TAG at $DIGEST" >> "$GITHUB_STEP_SUMMARY"

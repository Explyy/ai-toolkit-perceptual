user root;
worker_processes 1;
pid /run/dataset-studio-nginx.pid;
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    map $http_x_forwarded_proto $studio_proto {
        default invalid;
        "" $scheme;
        http http;
        https https;
    }
    map "$request_method:$uri" $readonly_settings {
        default 0;
        ~^(POST|PUT|PATCH|DELETE):/api/settings/?$ 1;
    }
    server {
        listen 8675;
        client_max_body_size 256m;
        if ($readonly_settings) { return 403; }
        if ($studio_proto = invalid) { return 400; }
        location = /_studio_auth {
            internal;
            proxy_pass http://127.0.0.1:8677/_studio_auth;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Studio-Method $studio_request_method;
            proxy_set_header X-Studio-Host $http_host;
            proxy_set_header X-Studio-Proto $studio_proto;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header Origin $http_origin;
        }
        location = /access {
            proxy_pass http://127.0.0.1:8677/access;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }
        location = /access/session {
            client_max_body_size 256;
            proxy_pass http://127.0.0.1:8677/access/session;
            proxy_set_header X-Studio-Method $request_method;
            proxy_set_header X-Studio-Host $http_host;
            proxy_set_header X-Studio-Proto $studio_proto;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
        }
        location / {
            # Capture in the main location, never recompute from auth subrequest GET.
            set $studio_request_method $request_method;
            auth_request /_studio_auth;
            proxy_pass http://127.0.0.1:8676;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $studio_proto;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header X-Studio-Method "";
            proxy_set_header X-Studio-Host "";
            proxy_set_header X-Studio-Proto "";
            proxy_read_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}

user root;
worker_processes 1;
pid /run/dataset-studio-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    map $http_x_forwarded_proto $studio_proto {
        default invalid;
        "" $scheme;
        http http;
        https https;
    }
    map "$request_method:$uri" $readonly_settings {
        default 0;
        ~^(POST|PUT|PATCH|DELETE):/api/settings/?$ 1;
    }
    server {
        listen 8675;
        auth_basic "Dataset Studio";
        auth_basic_user_file /run/dataset-studio-auth;
        client_max_body_size 256m;
        if ($readonly_settings) { return 403; }
        if ($studio_proto = invalid) { return 400; }
        location / {
            proxy_pass http://127.0.0.1:8676;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            # SimplePod HTTPS ingress must supply one sanitized protocol value.
            proxy_set_header X-Forwarded-Proto $studio_proto;
            proxy_set_header Authorization "";
            proxy_read_timeout 300s;
            proxy_request_buffering off;
            proxy_buffering off;
        }
    }
}
